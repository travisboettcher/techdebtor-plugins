# A hedge tells the model the instruction is optional.
extends: existence
message: "Drop the hedge '%s': state the instruction, or the condition under which it applies."
level: warning
ignorecase: true
tokens:
  - try to
  - try and
  - if possible
  - where possible
  - as much as possible
  - if you can
  - you might want to
  - you may want to
  - might want to
  - may want to
  - consider
  - perhaps
  - maybe
  - ideally
  - hopefully
