# Prose linting with Vale 3.28.1 (pinned in .github/workflows/prose.yml). Run from the repository
# root with relative paths: the section globs below pick each file's rules by its path.
# CONTRIBUTING.md says how to install the packages, run Vale and add vocabulary.
#
# StylesPath holds the upstream packages, unmodified, installed by .github/scripts/vale_packages.py
# from the versioned release zips and sha256 pins in .github/vale/packages.json (never `vale sync`;
# never a `latest` URL). They are gitignored. Tracked here: Repo/ and config/vocabularies/Repo/.
# - Prompts: rules for instruction files (skills, agents, commands, CLAUDE.md, eval prompts and
#   graders).
# - Voices: its shared core only (inflated words, throat-clearing, weasel attribution, recap
#   endings), on every file. No voice is enabled; one rule of Direct is (below).
# - proselint: on human-facing docs.
# - Std: not enabled; Repo.SentenceLength extends one of its rules.
# - Repo: this repository's own rule for model-facing text (SentenceLength);
#   config/vocabularies/Repo/accept.txt: terms Vale.Spelling accepts.
# Turn a rule off with `Package.Rule = NO`, or change its level with `= warning`, in the section for
# the files it misfires on, with a one-line comment saying why.
StylesPath = .github/vale/styles
MinAlertLevel = warning
Vocab = Repo
# Never lint code spans, fenced code or YAML front matter (Prompts' front matter rules read the raw
# file, so they still see it).
IgnoredScopes = code, tt, frontmatter

# Human-facing docs: every other Markdown file (README.md, CHANGELOG.md, CONTRIBUTING.md, docs/*.md).
# Nothing under plugins/*/evals/ is linted as docs: eval prompts and graders are model-facing
# (the section below), and everything else there is fixture content (sample repositories for
# `claude plugin eval`), which matches no section and so is not linted.
[!{CLAUDE.md,plugins/*/skills/**/*.md,plugins/*/agents/**/*.md,plugins/*/commands/**/*.md,plugins/*/docs/specialists/*.md,plugins/*/docs/examples/**/*.md,plugins/*/evals/**}]
BasedOnStyles = Vale, Voices, proselint
Vale.Repetition = error
Vale.Spelling = warning
Vale.Terms = warning
Voices.ColonReveal = NO
# Markdown source keeps ASCII quotes, `...` and plain spellings ("resume" the verb, not résumé).
proselint.CurlyQuotes = NO
proselint.Ellipsis = NO
proselint.Diacritical = NO

# Model-facing text: replaces the docs rules above for these files, eval prompts and graders included.
[{CLAUDE.md,plugins/*/skills/**/*.md,plugins/*/agents/**/*.md,plugins/*/commands/**/*.md,plugins/*/docs/specialists/*.md,plugins/*/docs/examples/**/*.md,plugins/*/evals/*/prompt.md,plugins/*/evals/*/graders/*.md}]
BasedOnStyles = Vale, Voices, Repo, Prompts
Vale.Repetition = error
Vale.Spelling = NO
Vale.Terms = NO
Voices.ColonReveal = NO
# Hedges in an instruction ("you may want to", "it's worth noting"); the rest of Direct (25-word
# sentences, a reading-ease floor) is a voice for chat replies, not for a contract.
Direct.Hedging = warning
# The skills' and agents' "never"s are their safety gates (no push without approval); a per-file
# cap of ten pushes toward weakening them.
Prompts.Absolutes = NO

# Agents are dispatched by name from a skill, never picked by their description, and an eval
# prompt's description names the case: neither needs a "Use when ..." trigger.
[{plugins/*/agents/**/*.md,plugins/*/evals/*/prompt.md}]
Prompts.Trigger = NO

# A regex grader's body is a regular expression: its escapes (`\s\S`, `\b`) are not Windows paths.
[plugins/*/evals/*/graders/*.md]
Prompts.Paths = NO

# Skills with `disable-model-invocation: true` run only as slash commands: no trigger phrase either.
# Add such a skill's path here.
[plugins/agent-loop/skills/{lead,dispatch}/SKILL.md]
Prompts.Trigger = NO
