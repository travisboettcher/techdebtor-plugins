# Prose linting with Vale 3.28.1 (pinned in .github/workflows/prose.yml). Run from the repository
# root with relative paths: the section globs below pick each file's style by its path.
# CONTRIBUTING.md says how to run it and how to add vocabulary.
#
# Styles, all under .github/vale/styles (never `vale sync`; nothing is fetched at lint time):
# - Prompt: this repo's rules for model-facing text.
# - write-good v0.5.0 (MIT) and proselint v0.4.0 (BSD-3-Clause): a vetted subset of each, copied
#   unmodified from their GitHub release zips, with their licenses. Levels are set here.
# - config/vocabularies/Repo/accept.txt: terms Vale.Spelling accepts.
StylesPath = .github/vale/styles
MinAlertLevel = warning
Vocab = Repo
# Never lint code spans, fenced code or YAML front matter.
IgnoredScopes = code, tt, frontmatter

# Human-facing docs: every other Markdown file (README.md, CHANGELOG.md, CONTRIBUTING.md, docs/*.md).
[!{CLAUDE.md,plugins/*/skills/**/*.md,plugins/*/agents/**/*.md,plugins/*/commands/**/*.md,plugins/*/docs/specialists/*.md,plugins/*/docs/examples/**/*.md}]
BasedOnStyles = Vale, write-good, proselint
Vale.Repetition = error
Vale.Spelling = warning
Vale.Terms = warning
write-good.Cliches = warning
write-good.So = warning
write-good.ThereIs = warning
proselint.Annotations = warning
proselint.Cliches = warning
proselint.CorporateSpeak = warning
proselint.Hedging = warning
proselint.Hyperbole = warning
proselint.Jargon = warning
proselint.Nonwords = warning
proselint.Redundancy = warning
proselint.Skunked = warning
proselint.Uncomparables = warning
proselint.Very = warning

# Model-facing text: replaces the docs rules above for these files.
[{CLAUDE.md,plugins/*/skills/**/*.md,plugins/*/agents/**/*.md,plugins/*/commands/**/*.md,plugins/*/docs/specialists/*.md,plugins/*/docs/examples/**/*.md}]
BasedOnStyles = Vale, Prompt
Vale.Spelling = NO
Vale.Terms = NO
Vale.Repetition = error
